<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Lines to Fill</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="login">
  <section class="view">
    <div class="card narrow">
      <h2>Login</h2>
      <form id="form-login" novalidate>
        <label for="log-username">Username</label>
        <input id="log-username" autocomplete="username">
        <label for="log-password">Password</label>
        <input id="log-password" type="password" autocomplete="current-password">
        <p class="msg" id="msg-login" role="alert"></p>
        <button class="btn primary" type="submit">Masuk</button>
      </form>
      <p class="alt">Belum punya akun? <a href="register.html">Register</a> &nbsp;|&nbsp; <a href="index.html">Beranda</a></p>
    </div>
  </section>
  <script src="script.js"></script>
</body>
</html>
